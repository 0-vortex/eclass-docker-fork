name: "Release"

on:
  push:
    branches:
      - main
      - alpha
      - beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    environment:
      name: production
      url: https://www.npmjs.com/package/eclass-docker-fork
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      issues: write # comment on released issues, open the failure issue
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: "☁️ checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🔧 setup node"
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: "📦 install dependencies"
        run: npm ci

      - name: "✅ test"
        run: npm test

      # No NPM_TOKEN: @semantic-release/npm exchanges the job's OIDC token with npm, which only
      # works once npmjs.com lists this repository and workflow as a trusted publisher.
      - name: "🚀 release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
